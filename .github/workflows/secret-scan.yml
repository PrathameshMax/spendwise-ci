name: secret-scan

# Stage: secret detection. Scans every commit the change introduces, not only the
# final tree, because a credential committed and then deleted is still in history
# and still leaked. Findings fail the pipeline and are uploaded to Code scanning.
#
# Known false positives are suppressed per repository with a .gitleaksignore file
# (one fingerprint per line, as printed in the job log), so every exception is
# reviewed in a pull request like any other change.

on:
  workflow_call:

permissions: {}

# The binary is pinned by version AND by SHA-256: a re-pointed release asset fails
# the checksum instead of running (the trivy-action tag hijack of March 2026 is
# the reason every third-party tool in this repository is pinned this way).
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull request: only the commits it adds. Push: the commits in the push.
      # First push to a branch, or a forced push: the whole history.
      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            echo "log-opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "log-opts=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          else
            echo "log-opts=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLf -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan commits for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          echo "Scanning: $LOG_OPTS"
          set +e
          gitleaks git . \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Secrets detected. Rotate the credential first, then remove it from history. A confirmed false positive goes in .gitleaksignore."
          fi
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Upload findings to Code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Gate
        run: exit "${status:-1}"
